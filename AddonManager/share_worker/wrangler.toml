# The send-a-backup relay (see SETUP.md). No secrets here.
name = "guild-share"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Logs OFF: nothing about a request (IP address included) is kept.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "BOX"
class_name = "ShareBox"

[[durable_objects.bindings]]
name = "RATE"
class_name = "RateBox"

# Guild storage for big send-later backups (Durable Object SQLite storage). WORKERS FREE ONLY:
# on Free, going over a limit is an error, never a bill. Never move this account to Workers Paid.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "StoreLedger"

[[durable_objects.bindings]]
name = "SLICE"
class_name = "StoreSlice"

# Free plan: only SQLite-backed Durable Objects. Never edit an old migration; add a new one.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareBox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateBox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["StoreLedger", "StoreSlice"]

# Per-IP limits (the IP is hashed and never stored). Approximate, per Cloudflare location.
[[ratelimits]]
name = "OPEN_LIMIT"
namespace_id = "7301"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "7302"
simple = { limit = 6, period = 60 }

[vars]
MAX_CHANNEL = "499"          # codes 1-499
TTL_SECONDS = "600"          # a code waits 10 minutes for the other PC
IDLE_SECONDS = "120"         # a transfer stops after 2 minutes without a call
MAX_SECONDS = "3600"         # and after 1 hour in any case
BUFFER = "4"                 # chunks waiting at most (4 MiB per mailbox)
CHUNK_MAX = "1048640"        # 1 MiB + tag + a little
MAX_BYTES = "545259520"      # 520 MiB per transfer (the app sends at most 500 MiB)
HARD_OPEN = "20"             # hard cap per IP: new codes ...
HARD_JOIN = "30"             # ... and code tries ...
HARD_WINDOW = "600"          # ... per 10 minutes (RateBox, memory only)
# Send later (file.kiwi; only when the player ticked it). The record holds no file, only a sealed link.
LATER_IDLE = "300"           # an upload for later stops after 5 minutes without the sender
LATER_UPLOAD_SECONDS = "21600"   # and after 6 hours of uploading in any case
LATER_MAX_HOURS = "24"       # the longest a later code can work (the player picks 1-24 h)
# Guild storage (tried before file.kiwi; only when the player ticked send later).
STORE_ON = "1"               # "0" = switched off: no new stores, no more uploads (apps use file.kiwi); downloads/deletes still work
STORE_PIECE = "4194304"      # bytes per upload/download request (4 MiB; 1048576 if CPU is tight)
STORE_ROW = "1048576"        # bytes per SQLite row
STORE_SLICE = "943718400"    # bytes per StoreSlice object (900 MiB; Free = 1 GB per object)
STORE_MAX_SEND = "4000000000"    # biggest stored send (bigger -> file.kiwi)
STORE_LIVE_CAP = "4400000000"    # stored at once for everyone (Free: 5 GB DO storage in all)
STORE_DAY_CAP = "20000000000"    # bytes stored per UTC day (keeps row writes far under 100k/day)
STORE_MAX_SECONDS = "86400"      # everything is deleted after 24 hours at most
STORE_START_SECONDS = "300"     # a reservation with no piece after 5 minutes is dropped
STORE_DOWNLOAD_SECONDS = "21600" # after the code is used: 6 hours to download, then deleted
HARD_STORE = "3"             # stored sends per IP ...
STORE_WINDOW = "86400"       # ... per day (RateBox, memory only)