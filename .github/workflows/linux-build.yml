# Builds the Linux (SteamOS / Steam Deck) Addon Manager and, with a tag, attaches it to
# that tag's DRAFT release. It never publishes a release: /commit does that after
# checking every file's digest, so self-update never sees a half release.
#
#   Test build (artifact only):   gh workflow run linux-build.yml
#   Release build:                gh workflow run linux-build.yml -f tag=vX.Y.Z
#
# Release files: AddonManager-x86_64.AppImage (the program; self-update uses it) and
# AddonManager.png (the icon, for Steam's "Add a Non-Steam Game").
#
# Pinned: actions by full commit SHA, the build image by digest, the two AppImage tools
# (appimagetool + type2 runtime, used only here) by release URL and sha256. No secrets:
# only the built-in GITHUB_TOKEN, and only the attach job may write (contents: write).

name: Linux build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (vX.Y.Z) of an existing DRAFT release. Empty = test build only."
        required: false
        default: ""

permissions: {}

concurrency:
  group: linux-build-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # python:3.13-bookworm (Debian 12, glibc 2.36: older than SteamOS 3.x, so the
    # program runs there). Digest of the multi-arch index, looked up 2026-11-09.
    container:
      image: python:3.13-bookworm@sha256:cc55e4ded9c95f6ce2133b3d096db43f214d280c2a8af65d83e246c8fa7d168c
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check the tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "Bad tag: $TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Tag matches APP_VERSION
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' AddonManager/am/__init__.py)
          [ "v$v" = "$TAG" ] || { echo "APP_VERSION $v does not match $TAG"; exit 1; }

      - name: Tools (virtual screen for the hidden window tests, fonts)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth xfonts-base fonts-dejavu-core
          # bsdtar: Add from file reads .rar/.7z with the system's tar (tests + self-test).
          apt-get install -y --no-install-recommends libarchive-tools
          # appimagetool's helpers (file type check, .desktop check).
          apt-get install -y --no-install-recommends file desktop-file-utils squashfs-tools
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          ldd --version | head -n 1

      # appimagetool 1.9.1 and the static type2 AppImage runtime (needs no libfuse2 on the
      # Deck), both from github.com/AppImage, checked by sha256 before use. appimagetool is
      # unpacked (--appimage-extract needs no FUSE, which the container doesn't have).
      - name: AppImage tools (pinned by sha256)
        env:
          TOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          TOOL_SHA: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          mkdir -p /opt/appimage
          cd /opt/appimage
          curl -fsSL --proto '=https' -o appimagetool-x86_64.AppImage "$TOOL_URL"
          curl -fsSL --proto '=https' -o runtime-x86_64 "$RUNTIME_URL"
          printf '%s  %s\n' "$TOOL_SHA" appimagetool-x86_64.AppImage "$RUNTIME_SHA" runtime-x86_64 | sha256sum -c -
          chmod 755 appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract > /dev/null
          rm appimagetool-x86_64.AppImage
          chmod -R a+rX /opt/appimage
          test -x /opt/appimage/squashfs-root/AppRun

      # Everything below runs as a normal user (root would ignore the read-only folder
      # checks the tests make), in a copy of the repo under that user's home (the whole
      # repo: a test compares addons.json at its root with the app's built-in list).
      - name: Tests, PyInstaller, AppImage and self-tests (as a normal user)
        run: |
          useradd -m builder
          mkdir /home/builder/repo /home/builder/out
          cp -r addons.json AddonManager /home/builder/repo/
          chown -R builder:builder /home/builder/repo /home/builder/out
          runuser -u builder -- bash -euo pipefail -c '
            cd /home/builder/repo/AddonManager
            python -m venv /home/builder/venv
            . /home/builder/venv/bin/activate
            pip install --disable-pip-version-check -q -r requirements-build.txt
            pip install --disable-pip-version-check -q --only-binary=:all: --require-hashes -r requirements-app.txt
            python -m compileall -q main.py am tests
            work=$(mktemp -d)
            ADDONMANAGER_TEST_TMP="$work/tests" xvfb-run -a python -m unittest discover -s tests -t .
            pyinstaller --noconfirm --clean --log-level WARN --distpath dist --workpath build AddonManager.spec
            prog=/home/builder/repo/AddonManager/dist/AddonManager
            test -x "$prog/AddonManager"

            # The AppImage: AppRun + .desktop + icon at the top, the one-folder program in
            # usr/lib/AddonManager. AppRun must have Unix line ends (a CR breaks #!/bin/sh).
            if grep -q "$(printf "\r")" linux/AppRun linux/AddonManager.desktop; then
              echo "linux/AppRun or AddonManager.desktop has Windows line ends"; exit 1
            fi
            appdir="$work/AppDir"
            mkdir -p "$appdir/usr/lib"
            cp -a "$prog" "$appdir/usr/lib/AddonManager"
            install -m 755 linux/AppRun "$appdir/AppRun"
            install -m 644 linux/AddonManager.desktop "$appdir/AddonManager.desktop"
            install -m 644 am/assets/AddonManager.png "$appdir/AddonManager.png"
            ln -s AddonManager.png "$appdir/.DirIcon"
            exe=/home/builder/out/AddonManager-x86_64.AppImage
            ARCH=x86_64 /opt/appimage/squashfs-root/AppRun --no-appstream \
                --runtime-file /opt/appimage/runtime-x86_64 "$appdir" "$exe"
            chmod 755 "$exe"
            test -x "$exe"
            # A type 2 AppImage: ELF with "AI" 0x02 at byte 8 (what self-update checks).
            [ "$(od -An -tx1 -j8 -N3 "$exe" | tr -d " \n")" = "414902" ] \
              || { echo "Not a type 2 AppImage"; exit 1; }

            # The container has no FUSE: the AppImage unpacks itself to /tmp and runs from
            # there (the Deck mounts it instead). The runtime still sets APPIMAGE/APPDIR.
            export APPIMAGE_EXTRACT_AND_RUN=1

            # Hidden self-test on fake data (never a real game folder).
            mapfile -t data < <(python -m tests.make_selftest_data "$work/selftest")
            xvfb-run -a "$exe" --selftest --manifest "${data[0]}" --wow "${data[1]}" \
                --github-api "${data[2]}" --home "$work/home" --selftest-out "$work/selftest.json" \
              || { cat "$work/selftest.json" || true; exit 1; }
            cat "$work/selftest.json"
            # Drag and drop (tkinterdnd2/tkdnd) on Linux: reported, never fails the build;
            # where tkdnd cannot load, the program simply runs without drag and drop.
            python -c "import json,sys; r=json.load(open(sys.argv[1])); [print(\"Drag and drop:\", s[\"detail\"]) for s in r[\"steps\"] if s[\"step\"] == \"drag and drop\"]" "$work/selftest.json" || true

            # Self-update on a COPY of the program (fake release v99.0.0).
            mapfile -t upd < <(python -m tests.make_selftest_data "$work/selfupdate" --app-update "$exe")
            xvfb-run -a "${upd[0]}" --selftest-update --github-api "${upd[1]}" \
                --home "$work/home-update" --selftest-out "$work/selfupdate.json" \
              || { cat "$work/selfupdate.json" || true; exit 1; }
            cat "$work/selfupdate.json"
            # It must have updated the .AppImage file itself (found through $APPIMAGE), not
            # the unpacked program inside it.
            python -c "import json,os,sys; r=json.load(open(sys.argv[1])); d=[s[\"detail\"] for s in r[\"steps\"] if s[\"step\"] == \"folder\"]; ok=d == [os.path.dirname(sys.argv[2])]; print(\"Updated file folder:\", d, \"ok\" if ok else \"WRONG\"); sys.exit(0 if ok else 1)" "$work/selfupdate.json" "${upd[0]}"

            echo "Newest glibc the program needs (program + bundled libraries):"
            { find "$prog" -type f \( -name AddonManager -o -name "*.so*" \) \
                -exec objdump -T {} + 2>/dev/null || true; } \
              | { grep -o "GLIBC_[0-9.]*" || true; } | sort -uV | tail -n 1
          '

      # Like SteamOS: no Debian certificate folder (/usr/lib/ssl), the bundle only at
      # /etc/ssl/certs/ca-certificates.crt. The program must find it by itself (sysenv),
      # and programs it starts must not get its _internal libraries. Throwaway container:
      # the folder is moved aside as root and put back after.
      - name: Self-test without Debian's certificate folder (like SteamOS)
        run: |
          mv /usr/lib/ssl /usr/lib/ssl.moved
          runuser -u builder -- bash -euo pipefail -c '
            cd /home/builder/repo/AddonManager
            . /home/builder/venv/bin/activate
            export APPIMAGE_EXTRACT_AND_RUN=1
            work=$(mktemp -d)
            mapfile -t data < <(python -m tests.make_selftest_data "$work/selftest")
            xvfb-run -a /home/builder/out/AddonManager-x86_64.AppImage --selftest \
                --manifest "${data[0]}" --wow "${data[1]}" --github-api "${data[2]}" \
                --home "$work/home" --selftest-out "$work/selftest.json" \
              || { cat "$work/selftest.json" || true; exit 1; }
            python -c "import json,sys; s={x[\"step\"]: x for x in json.load(open(sys.argv[1]))[\"steps\"]}; c=s[\"certificates\"]; e=s[\"child env\"]; print(\"Certificates:\", c[\"detail\"]); print(\"Child env:\", e[\"detail\"]); sys.exit(0 if c[\"ok\"] and c[\"detail\"].startswith(\"SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt\") and e[\"ok\"] else 1)" "$work/selftest.json"
          '
          mv /usr/lib/ssl.moved /usr/lib/ssl

      - name: Package and sha256
        run: |
          mkdir -p out
          install -m 755 /home/builder/out/AddonManager-x86_64.AppImage out/AddonManager-x86_64.AppImage
          # The app's icon as its own small file, for Steam's "Add a Non-Steam Game"
          # (Steam doesn't take the icon out of an AppImage).
          install -m 644 AddonManager/am/assets/AddonManager.png out/AddonManager.png
          cd out
          sha256sum AddonManager-x86_64.AppImage AddonManager.png | tee SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: AddonManager-linux
          path: |
            out/AddonManager-x86_64.AppImage
            out/AddonManager.png
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  attach:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only here: upload files to the draft release
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: AddonManager-linux
          path: out

      - name: Upload to the DRAFT release (never publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = "true" ] || { echo "$TAG is not a draft release; nothing uploaded."; exit 1; }
          cd out
          sha256sum -c SHA256SUMS
          gh release upload "$TAG" AddonManager-x86_64.AppImage AddonManager.png --clobber
          cat SHA256SUMS
